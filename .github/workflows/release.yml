          if (latest?.id !== release.id || latest?.tag_name !== release.tag_name) throw new Error("Canonical release is not immutable Latest before npm publication");
          const archive = release.assets.find((asset) => asset.name === archiveName);
          if (archive.digest !== `sha256:${sha256}` || archive.size !== statSync(tarball).size) throw new Error("npm publication input is not the exact canonical archive bytes");
          appendFileSync(process.env.GITHUB_OUTPUT, `archive_integrity=${integrity}\narchive_sha256=${sha256}\npackage_version=${version}\ntarball=${tarball}\n`);
          NODE
      - name: Publish the exact canonical archive through npm trusted publishing
        id: npm
        env:
          EXPECTED_ARCHIVE_INTEGRITY: ${{ steps.canonical.outputs.archive_integrity }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.canonical.outputs.archive_sha256 }}
          EXPECTED_VERSION: ${{ steps.canonical.outputs.package_version }}
          TARBALL: ${{ steps.canonical.outputs.tarball }}
        run: |
          set -euo pipefail
          node -e '
            const conflicting = Object.keys(process.env)
              .filter(name => name.toLowerCase() === "npm_config_tag");
            if (conflicting.length !== 0) {
              throw new Error(`Ambient npm tag configuration is forbidden: ${conflicting.join(", ")}`);
            }
          '
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                ! "$EXPECTED_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ || \
                ! "$EXPECTED_ARCHIVE_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]{86}==$ || \
                "$GITHUB_REF" != "refs/tags/v$EXPECTED_VERSION" ]]; then
            echo "::error::npm publication identity is invalid"
            exit 1
          fi
          clean_npm_directory="$(mktemp -d "$RUNNER_TEMP/kb-npm-clean.XXXXXX")"
          clean_user_config="$(mktemp "$RUNNER_TEMP/kb-npm-user.XXXXXX")"
          clean_global_config="$(mktemp "$RUNNER_TEMP/kb-npm-global.XXXXXX")"
          chmod 700 "$clean_npm_directory"
          chmod 600 "$clean_user_config" "$clean_global_config"
          if [[ "$(cd "$clean_npm_directory" && npm config get tag \
                --userconfig="$clean_user_config" \
                --globalconfig="$clean_global_config")" != latest ]]; then
            echo "::error::Pinned npm's clean default publication tag is not latest"
            exit 1
          fi
          current_archive_sha256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          if [[ "$current_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error::Admitted archive changed before npm publication"
            exit 1
          fi
          registry_state="$(EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARCHIVE_INTEGRITY="$EXPECTED_ARCHIVE_INTEGRITY" node --input-type=module <<'NODE'
          const name = "@hraness/wordcell";
          const version = process.env.EXPECTED_VERSION ?? "";
          const expectedIntegrity = process.env.EXPECTED_ARCHIVE_INTEGRITY ?? "";
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            cache: "no-store", redirect: "error", signal: AbortSignal.timeout(30_000),
            headers: { Accept: "application/json", "Cache-Control": "no-cache", "User-Agent": "wordcell-release" },
          });
          const text = await response.text();
          if (text.length > 1_000_000) throw new Error("npm registry version response exceeds its bound");
          if (response.status === 404) { process.stdout.write("absent"); }
          else if (response.status === 200) {
            const payload = JSON.parse(text);
            if (payload?.name !== name || payload?.version !== version || typeof payload?.dist?.integrity !== "string") {
              throw new Error("npm registry returned an invalid published version");
            }
            if (payload.dist.integrity !== expectedIntegrity) {
              throw new Error(`npm already publishes ${name}@${version} with different bytes; never overwrite it`);
            }
            process.stdout.write("published");
          } else throw new Error(`npm registry returned HTTP ${response.status} for ${name}@${version}`);
          NODE
          )"
          if [[ "$registry_state" == published ]]; then
            echo "@hraness/wordcell@$EXPECTED_VERSION already publishes the exact canonical bytes; nothing to publish"
            printf 'npm_state=published\npublished_identity=%s\n' "@hraness/wordcell@$EXPECTED_VERSION $EXPECTED_ARCHIVE_INTEGRITY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$registry_state" != absent ]]; then
            echo "::error::npm registry state is ambiguous"
            exit 1
          fi
          registry_json="$(mktemp "$RUNNER_TEMP/wordcell-npm-metadata.XXXXXX")"
          node --input-type=module > "$registry_json" <<'NODE'
          const response = await fetch("https://registry.npmjs.org/%40hraness%2Fwordcell", {
            cache: "no-store", redirect: "error", signal: AbortSignal.timeout(30_000),
            headers: { Accept: "application/json", "Cache-Control": "no-cache", "User-Agent": "wordcell-release" },
          });
          if (response.status !== 200) throw new Error(`npm package metadata returned HTTP ${response.status}`);
          const text = await response.text();
          if (text.length > 5_000_000) throw new Error("npm package metadata exceeds its bound");
          process.stdout.write(text);
          NODE
          REGISTRY_JSON="$registry_json" EXPECTED_VERSION="$EXPECTED_VERSION" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const maximum = 9007199254740991n;
          const pattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          const parse = (value, label) => {
            const match = pattern.exec(value);
            if (match === null) throw new Error(`${label} is not stable SemVer`);
            const components = match.slice(1).map(BigInt);
            if (components.some(component => component > maximum)) {
              throw new Error(`${label} exceeds npm 11's safe SemVer component bound`);
            }
            return components;
          };
          const record = (value, label) => {
            if (value === null || typeof value !== "object" || Array.isArray(value)) throw new Error(`${label} is not an object`);
            return value;
          };
          const candidate = parse(process.env.EXPECTED_VERSION ?? "", "release candidate");
          const metadata = record(JSON.parse(readFileSync(process.env.REGISTRY_JSON, "utf8")), "npm package metadata");
          if (metadata.name !== "@hraness/wordcell") throw new Error("npm package metadata names another package");
          const tags = record(metadata["dist-tags"], "npm dist-tags");
          const versions = record(metadata.versions, "npm versions");
          if (Object.hasOwn(versions, process.env.EXPECTED_VERSION)) throw new Error("npm candidate appeared after the exact-version check; reconcile before retrying");
          const bootstrapVersion = "0.20.0-bootstrap.1";
          if (!Object.hasOwn(tags, "latest") || tags.latest === bootstrapVersion) {
            // One reviewed first-publication state, including the observed latest alias.
            const tagKeys = Object.keys(tags).sort().join(",");
            if (process.env.EXPECTED_VERSION !== "0.20.0"
              || (tagKeys !== "bootstrap" && tagKeys !== "bootstrap,latest")
              || tags.bootstrap !== bootstrapVersion
              || (Object.hasOwn(tags, "latest") && tags.latest !== bootstrapVersion)
              || Object.keys(versions).length !== 1 || !Object.hasOwn(versions, bootstrapVersion)) {
              throw new Error("First publication requires only the exact reviewed bootstrap version and tags");
            }
            const bootstrap = record(versions[bootstrapVersion], "npm bootstrap version");
            if (bootstrap.name !== "@hraness/wordcell" || bootstrap.version !== bootstrapVersion
              || bootstrap.dist?.integrity !== "sha512-31YbWYj6wCg3TmuFtNAN3bqiOyZUmfPWIlqHzKVau5BRDr41hOx/sw9FZ0D9o4v3i9k8Ly61vRMXqtIFtvYneA==") {
              throw new Error("npm bootstrap identity or archive differs from the reviewed artifact");
            }
            process.exit(0);
          }
          const latestValue = tags.latest;
          if (typeof latestValue !== "string") throw new Error("npm latest is not one exact version");
          const latest = parse(latestValue, "npm latest");
          const comparison = candidate[0] === latest[0]
            ? candidate[1] === latest[1]
              ? candidate[2] === latest[2] ? 0 : candidate[2] > latest[2] ? 1 : -1
              : candidate[1] > latest[1] ? 1 : -1
            : candidate[0] > latest[0] ? 1 : -1;
          if (comparison <= 0) throw new Error("Release candidate must be newer than current npm latest");
          NODE
          current_main="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]
          for source in "$VERIFIED_SOURCE_SHA" "$WORKFLOW_SHA"; do
            status="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/compare/$source...$current_main" --jq .status)"
            [[ "$status" == ahead || "$status" == identical ]]
          done
          for path in .github/workflows/release.yml scripts/package-artifact.ts scripts/npm-package-identity.ts scripts/npm-release-attestation.ts scripts/github-release.ts scripts/package-smoke.ts scripts/prepare-npm-package.ts; do
            reviewed="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$WORKFLOW_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$reviewed" =~ ^[a-f0-9]{40}$ && "$reviewed" == "$current" ]]
          done
          test "$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$current_main"
          publish_result="$(mktemp "$RUNNER_TEMP/kb-npm-publish-result.XXXXXX")"
          cd "$clean_npm_directory"
          npm publish "$TARBALL" \
            --access public \
            --globalconfig="$clean_global_config" \
            --ignore-scripts \
            --json \
            --provenance \
            --registry=https://registry.npmjs.org \
            --userconfig="$clean_user_config" \
            > "$publish_result"
          published_identity="$(PUBLISH_RESULT="$publish_result" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARCHIVE_INTEGRITY="$EXPECTED_ARCHIVE_INTEGRITY" node <<'NODE'
          const { readFileSync } = require("node:fs");
          // npm 11.19.0 `publish --json` prints one object keyed by package name.
          const result = JSON.parse(readFileSync(process.env.PUBLISH_RESULT, "utf8"));
          const expectedName = "@hraness/wordcell";
          if (
            result === null
            || typeof result !== "object"
            || Array.isArray(result)
            || Object.keys(result).length !== 1
          ) throw new Error("npm did not return one published package record");
          const output = result[expectedName];
          if (
            output === null
            || typeof output !== "object"
            || Array.isArray(output)
            || output.name !== expectedName
            || output.version !== process.env.EXPECTED_VERSION
            || output.id !== `${expectedName}@${process.env.EXPECTED_VERSION}`
            || output.integrity !== process.env.EXPECTED_ARCHIVE_INTEGRITY
          ) throw new Error("npm did not return the exact published Wordcell identity");
          process.stdout.write(`${output.id} ${output.integrity}`);
          NODE
          )"
          printf 'npm_state=published\npublished_identity=%s\n' "$published_identity" >> "$GITHUB_OUTPUT"

  admit_npm:
    name: Admit the public npm package
    needs: [verify, publish_npm]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_ARCHIVE: ${{ needs.verify.outputs.archive_name }}
      EXPECTED_HASHES: ${{ needs.verify.outputs.artifact_hashes }}
      PUBLISHED_IDENTITY: ${{ needs.publish_npm.outputs.published_identity }}
      VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          [[ "$(node --version)" == v24.* ]]
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the public registry archive, signatures, and provenance against the canonical asset
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$(git rev-parse --verify HEAD)" != "$WORKFLOW_SHA" ]]; then
            echo "::error::npm admission identity is incomplete"
            exit 1
          fi
          version="${VERIFIED_TAG#v}"
          [[ "$EXPECTED_ARCHIVE" == "hraness-wordcell-$version.tgz" ]]
          [[ "$PUBLISHED_IDENTITY" == "@hraness/wordcell@$version sha512-"* ]]
          work="$(mktemp -d "$RUNNER_TEMP/kb-npm-admit.XXXXXX")"
          mkdir "$work/canonical" "$work/registry" "$work/consumer"
          release_json="$(mktemp "$RUNNER_TEMP/kb-npm-admit-release.XXXXXX")"
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG" > "$release_json"
          for asset in "$EXPECTED_ARCHIVE" npm-pack.json; do
            asset_id="$(RELEASE_JSON="$release_json" ASSET="$asset" node -e '
              const release = JSON.parse(require("node:fs").readFileSync(process.env.RELEASE_JSON, "utf8"));
              if (release?.immutable !== true || release?.draft !== false || !Array.isArray(release?.assets)) process.exit(1);
              const matches = release.assets.filter((asset) => asset?.name === process.env.ASSET && asset?.state === "uploaded");
              if (matches.length !== 1 || !Number.isSafeInteger(matches[0].id) || matches[0].id < 1) process.exit(1);
              process.stdout.write(String(matches[0].id));
            ')"
            gh api -H "Accept: application/octet-stream" "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$work/canonical/$asset"
          done
          expected_archive_sha256="$(EXPECTED_HASHES="$EXPECTED_HASHES" EXPECTED_ARCHIVE="$EXPECTED_ARCHIVE" node -p 'JSON.parse(process.env.EXPECTED_HASHES)[process.env.EXPECTED_ARCHIVE]')"
          [[ "$(sha256sum "$work/canonical/$EXPECTED_ARCHIVE" | cut -d ' ' -f 1)" == "$expected_archive_sha256" ]]
          canonical_sha512="$(sha512sum "$work/canonical/$EXPECTED_ARCHIVE" | cut -d ' ' -f 1)"
          npm view "@hraness/wordcell@$version" --json --registry=https://registry.npmjs.org > "$work/registry/npm-view.json"
          npm view "@hraness/wordcell" dist-tags.latest --json --registry=https://registry.npmjs.org > "$work/registry/latest.json"
          (cd "$work/registry" && npm pack "@hraness/wordcell@$version" --ignore-scripts --json --registry=https://registry.npmjs.org > "$work/registry/npm-pack.json")
          cmp --silent "$work/registry/$EXPECTED_ARCHIVE" "$work/canonical/$EXPECTED_ARCHIVE"
          bun run ./scripts/npm-package-identity.ts \
            --expected-name @hraness/wordcell \
            --expected-version "$version" \
            --registry-archive "$work/registry/$EXPECTED_ARCHIVE" \
            --registry-pack-json "$work/registry/npm-pack.json" \
            --registry-view-json "$work/registry/npm-view.json" \
            --source-archive "$work/canonical/$EXPECTED_ARCHIVE" \
            --source-pack-json "$work/canonical/npm-pack.json"
          (cd "$work/consumer" \
            && npm init --yes >/dev/null \
            && npm install "@hraness/wordcell@$version" --ignore-scripts --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org \
            && npm audit signatures --json --include-attestations --omit=dev --registry=https://registry.npmjs.org > "$work/audit.json")
          bun run ./scripts/npm-release-attestation.ts \
            --audit-json "$work/audit.json" \
            --expected-source-sha "$VERIFIED_SOURCE_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --maximum-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-tarball-sha512 "$canonical_sha512" \
            --expected-version "$version" \
            --registry-latest-json "$work/registry/latest.json" \
            --registry-view-json "$work/registry/npm-view.json"
