name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/kb"
          EXPECTED_REPOSITORY_ID: "1308971873"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      default_branch: ${{ steps.identity.outputs.default_branch }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          [[ "$(node --version)" == v24.* ]]
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"

          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REF" != "refs/tags/$release_tag" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires a protected owner-created stable tag"
            exit 1
          fi

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag $release_tag is not a stable semantic version"
            exit 1
          fi
          RELEASE_VERSION="${release_tag#v}" node -e '
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.exec(process.env.RELEASE_VERSION ?? "");
            if (match === null || match.slice(1).some((part) => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) {
              console.error("::error::Release version components must not exceed Number.MAX_SAFE_INTEGER");
              process.exit(1);
            }
          '
          git check-ref-format "refs/tags/$release_tag"
          release_ref="refs/kb-release-tags/$release_tag"
          git fetch --no-tags origin "refs/tags/$release_tag:$release_ref"
          if [[ "$(git cat-file -t "$release_ref")" != tag ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-parse "$release_ref^{commit}")"
          if [[ ! "$tag_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Release tag did not resolve to one commit"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$tag_commit" ]]; then
            echo "::error::Tag event does not match release commit $tag_commit"
            exit 1
          fi
          if [[ "$checked_out_head" != "$default_head" ]]; then
            echo "::error::Reviewed checkout is not exact current $DEFAULT_BRANCH"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$default_head"; then
            echo "::error::Tag $release_tag is not reachable from current $DEFAULT_BRANCH"
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff --no-textconv \
            "$tag_commit" "$default_head" -- \
            .github/workflows/release.yml \
            .github/workflows/npm-stage.yml; then
            echo "::error::Tagged and current release workflow controls differ"
            exit 1
          fi

          package_manifest="$RUNNER_TEMP/kb-release-package.json"
          git show "$tag_commit:package.json" > "$package_manifest"
          package_name="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (value?.name !== "@hraness/kb" || typeof value.version !== "string") process.exit(1);
            process.stdout.write(value.name);
          ' "$package_manifest")"
          package_version="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (typeof value?.version !== "string") process.exit(1);
            process.stdout.write(value.version);
          ' "$package_manifest")"
          if [[ "$package_name" != "@hraness/kb" || \
                ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$release_tag" != "v$package_version" ]]; then
            echo "::error::Tag $release_tag does not match the KB package identity"
            exit 1
          fi

          git fetch --force --tags origin
          refreshed_tag_commit="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          if [[ "$refreshed_tag_commit" != "$tag_commit" ]]; then
            echo "::error::Tag $release_tag changed during identity verification"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | node -e '
            const { readFileSync } = require("node:fs");
            const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const maximum = BigInt(Number.MAX_SAFE_INTEGER);
            const parse = (tag) => {
              const match = pattern.exec(tag);
              if (match === null) return null;
              const parts = match.slice(1).map(BigInt);
              if (parts.some((part) => part > maximum)) {
                console.error("::error::Stable version components exceed Number.MAX_SAFE_INTEGER: " + tag);
                process.exit(1);
              }
              return parts;
            };
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
              }
              return 0;
            };
            let newest = null;
            for (const tag of readFileSync(0, "utf8").split(/\r?\n/u)) {
              const parts = parse(tag);
              if (parts !== null && (newest === null || compare(parts, newest.parts) > 0)) {
                newest = { parts, tag };
              }
            }
            process.stdout.write(newest?.tag ?? "");
          ')"
          if [[ "$newest_stable_tag" != "$release_tag" ]]; then
            echo "::error::Tag $release_tag is not the newest stable tag $newest_stable_tag"
            exit 1
          fi

          printf 'default_branch=%s\nsource_sha=%s\ntag=%s\nworkflow_sha=%s\n' \
            "$DEFAULT_BRANCH" "$tag_commit" "$release_tag" "$default_head" \
            >> "$GITHUB_OUTPUT"
      - name: Materialize exact tagged source
        id: source
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_tree="$RUNNER_TEMP/kb-release-source-tree"
          if [[ -e "$source_tree" ]]; then
            echo "::error::Tagged source directory already exists"
            exit 1
          fi
          git worktree add --detach "$source_tree" "$SOURCE_SHA"
          if [[ "$(git -C "$source_tree" rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Detached release source does not match the verified tag commit"
            exit 1
          fi
          printf 'tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
      - name: Install tagged source
        working-directory: ${{ steps.source.outputs.tree }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check tagged source
        working-directory: ${{ steps.source.outputs.tree }}
        run: bun run check
      - name: Verify generated tagged tree
        working-directory: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Verify tagged package boundary
        working-directory: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          bun pm pack --dry-run --ignore-scripts
          node --input-type=module -e 'const manifest = (await import("./package.json", { with: { type: "json" } })).default; await Promise.all(Object.values(manifest.exports).map(({ import: path }) => import(path)))'
      - name: Verify canonical npm delivery
        env:
          EXPECTED_NAME: "@hraness/kb"
          EXPECTED_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.tag }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          WORKFLOW_SHA: ${{ steps.identity.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          package_version="${EXPECTED_VERSION#v}"
          if [[ "$EXPECTED_VERSION" != "v$package_version" || \
                ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package version is invalid"
            exit 1
          fi
          package_spec="$EXPECTED_NAME@$package_version"
          tarball_name="hraness-kb-$package_version.tgz"
          source_directory="$RUNNER_TEMP/kb-release-source-package"
          registry_directory="$RUNNER_TEMP/kb-release-registry-package"
          source_archive="$source_directory/$tarball_name"
          source_pack_json="$source_directory/npm-pack.json"
          registry_archive="$registry_directory/$tarball_name"
          registry_pack_json="$registry_directory/npm-pack.json"
          registry_view_json="$registry_directory/npm-view.json"
          registry_latest_json="$registry_directory/npm-latest.json"
          registry_audit_json="$registry_directory/npm-audit-signatures.json"
          audit_directory="$RUNNER_TEMP/kb-release-signature-audit"

          registry_ready=false
          for registry_poll in {1..60}; do
            published_version="$(npm view "$package_spec" version --json \
              --registry=https://registry.npmjs.org 2>/dev/null || true)"
            published_latest="$(npm view "$EXPECTED_NAME" dist-tags.latest --json \
              --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$published_version" == "\"$package_version\"" && \
                  "$published_latest" == "\"$package_version\"" ]]; then
              registry_ready=true
              break
            fi
            sleep 10
          done
          if [[ "$registry_ready" != true ]]; then
            echo "::error::$package_spec did not become readable from npm in time"
            exit 1
          fi

          if [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" != "$WORKFLOW_SHA" ]]; then
            echo "::error::Reviewed workflow checkout changed before package verification"
            exit 1
          fi
          current_tools=(
            scripts/package-artifact.ts
            scripts/npm-package-identity.ts
            scripts/npm-release-attestation.ts
            scripts/package-smoke.ts
            scripts/prepare-npm-package.ts
          )
          for relative_tool in "${current_tools[@]}"; do
            current_tool="$GITHUB_WORKSPACE/$relative_tool"
            if [[ ! -f "$current_tool" || -L "$current_tool" ]]; then
              echo "::error::Reviewed current workflow tool is missing or linked: $relative_tool"
              exit 1
            fi
            expected_blob="$(git -C "$GITHUB_WORKSPACE" rev-parse "$WORKFLOW_SHA:$relative_tool")"
            actual_blob="$(git hash-object "$current_tool")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "::error::Reviewed current workflow tool changed: $relative_tool"
              exit 1
            fi
          done
          current_prepare="$GITHUB_WORKSPACE/scripts/prepare-npm-package.ts"
          current_identity="$GITHUB_WORKSPACE/scripts/npm-package-identity.ts"
          current_attestation="$GITHUB_WORKSPACE/scripts/npm-release-attestation.ts"
          current_smoke="$GITHUB_WORKSPACE/scripts/package-smoke.ts"

          (
            cd "$SOURCE_TREE"
            bun --no-env-file --config=/dev/null run \
              "$current_prepare" "$source_directory"
          )
          mkdir -p "$registry_directory"
          npm pack "$package_spec" \
            --ignore-scripts \
            --json \
            --pack-destination "$registry_directory" \
            --registry=https://registry.npmjs.org \
            > "$registry_pack_json"
          npm view "$package_spec" name version dist \
            --json \
            --registry=https://registry.npmjs.org \
            > "$registry_view_json"
          npm view "$EXPECTED_NAME" dist-tags.latest \
            --json \
            --registry=https://registry.npmjs.org \
            > "$registry_latest_json"
          bun --no-env-file --config=/dev/null run "$current_identity" \
            --expected-name "$EXPECTED_NAME" \
            --expected-version "$package_version" \
            --source-archive "$source_archive" \
            --source-pack-json "$source_pack_json" \
            --registry-archive "$registry_archive" \
            --registry-pack-json "$registry_pack_json" \
            --registry-view-json "$registry_view_json"
          (
            cd "$SOURCE_TREE"
            bun --no-env-file --config=/dev/null run "$current_smoke" \
              --archive "$registry_archive" \
              --pack-json "$registry_pack_json"
          )

          if [[ -e "$audit_directory" ]]; then
            echo "::error::npm signature audit directory already exists"
            exit 1
          fi
          mkdir -p "$audit_directory"
          AUDIT_DIRECTORY="$audit_directory" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          writeFileSync(join(process.env.AUDIT_DIRECTORY, "package.json"), `${JSON.stringify({
            name: "kb-release-signature-audit",
            private: true,
            version: "0.0.0",
          }, null, 2)}\n`, { encoding: "utf8", flag: "wx" });
          NODE
          (
            cd "$audit_directory"
            npm install "$package_spec" \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              --package-lock=false \
              --save-exact \
              --registry=https://registry.npmjs.org
            npm audit signatures \
              --json \
              --include-attestations \
              --registry=https://registry.npmjs.org \
              > "$registry_audit_json"
          )
          registry_tarball_sha512="$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            process.stdout.write(createHash("sha512").update(readFileSync(process.argv[1])).digest("hex"));
          ' "$registry_archive")"
          bun --no-env-file --config=/dev/null run "$current_attestation" \
            --audit-json "$registry_audit_json" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-tarball-sha512 "$registry_tarball_sha512" \
            --expected-version "$package_version" \
            --registry-latest-json "$registry_latest_json" \
            --registry-view-json "$registry_view_json"

  publish:
    name: Publish
    needs: verify
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ needs.verify.outputs.default_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/kb"
          EXPECTED_REPOSITORY_ID: "1308971873"
          EXPECTED_WORKFLOW_ID: "320004141"
          EXPECTED_WORKFLOW_NAME: "Release"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/kb-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/kb-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/kb-release-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$VERIFIED_SOURCE_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          NODE
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified release identity is incomplete"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Protected tag release event changed after verification"
            exit 1
          fi

          verify_current_release_controls() {
            local advertised_main imported_main
            advertised_main="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
            git fetch --no-tags --force origin \
              "refs/heads/$DEFAULT_BRANCH:refs/remotes/kb-release-current/$DEFAULT_BRANCH"
            imported_main="$(git rev-parse "refs/remotes/kb-release-current/$DEFAULT_BRANCH")"
            if [[ ! "$advertised_main" =~ ^[a-f0-9]{40}$ || \
                  "$imported_main" != "$advertised_main" ]]; then
              echo "::error::Could not import one exact current $DEFAULT_BRANCH authority" >&2
              return 1
            fi
            if ! git merge-base --is-ancestor "$VERIFIED_SOURCE_SHA" "$imported_main" || \
               ! git merge-base --is-ancestor "$WORKFLOW_SHA" "$imported_main"; then
              echo "::error::Release source or reviewed workflow is no longer on current $DEFAULT_BRANCH" >&2
              return 1
            fi
            if ! git diff --quiet --no-ext-diff --no-textconv \
              "$VERIFIED_SOURCE_SHA" "$imported_main" -- \
              .github/workflows/release.yml \
              .github/workflows/npm-stage.yml; then
              echo "::error::Tagged and current release workflow controls differ" >&2
              return 1
            fi
            if ! git diff --quiet --no-ext-diff --no-textconv \
              "$WORKFLOW_SHA" "$imported_main" -- \
              scripts/package-artifact.ts \
              scripts/npm-package-identity.ts \
              scripts/npm-release-attestation.ts \
              scripts/package-smoke.ts \
              scripts/prepare-npm-package.ts; then
              echo "::error::Current release verifier controls changed after verification" >&2
              return 1
            fi
            printf '%s\n' "$imported_main"
          }

          current_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$VERIFIED_TAG" --jq '.sha')"
          current_default_sha="$(verify_current_release_controls)"
          if [[ "$current_tag_sha" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Tag $VERIFIED_TAG moved to $current_tag_sha after verification"
            exit 1
          fi
          comparison_status="$(gh api \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SOURCE_SHA...$current_default_sha" \
            --jq '.status')"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          repository_tags="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name')"
          printf '%s\n' "$repository_tags" | NEXT_TAG="$VERIFIED_TAG" node -e '
            const fs = require("node:fs");
            const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const maximum = BigInt(Number.MAX_SAFE_INTEGER);
            const parse = (tag) => {
              const match = pattern.exec(tag);
              if (match === null) return null;
              const parts = match.slice(1).map(BigInt);
              if (parts.some((part) => part > maximum)) {
                console.error("::error::Stable version components exceed Number.MAX_SAFE_INTEGER: " + tag);
                process.exit(1);
              }
              return parts;
            };
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
              }
              return 0;
            };
            const nextTag = process.env.NEXT_TAG ?? "";
            const next = parse(nextTag);
            if (next === null) process.exit(1);
            let found = false;
            for (const tag of fs.readFileSync(0, "utf8").split(/\r?\n/u)) {
              const current = parse(tag);
              if (current === null) continue;
              if (tag === nextTag) found = true;
              if (compare(next, current) < 0) {
                console.error("::error::Release " + nextTag + " is older than repository tag " + tag);
                process.exit(1);
              }
            }
            if (!found) process.exit(1);
          '

          published_tags="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          printf '%s\n' "$published_tags" | NEXT_TAG="$VERIFIED_TAG" node -e '
            const fs = require("node:fs");
            const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const maximum = BigInt(Number.MAX_SAFE_INTEGER);
            const parse = (tag) => {
              const match = pattern.exec(tag);
              if (match === null) return null;
              const parts = match.slice(1).map(BigInt);
              if (parts.some((part) => part > maximum)) {
                console.error("::error::Stable version components exceed Number.MAX_SAFE_INTEGER: " + tag);
                process.exit(1);
              }
              return parts;
            };
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
              }
              return 0;
            };
            const nextTag = process.env.NEXT_TAG ?? "";
            const next = parse(nextTag);
            if (next === null) process.exit(1);
            for (const tag of fs.readFileSync(0, "utf8").split(/\r?\n/u)) {
              const current = parse(tag);
              if (current !== null && tag !== nextTag && compare(next, current) <= 0) {
                console.error("::error::Release " + nextTag + " is not newer than " + tag);
                process.exit(1);
              }
            }
          '

          verified_version="${VERIFIED_TAG#v}"
          npm_latest="$(npm view "@hraness/kb" dist-tags.latest \
            --json \
            --registry=https://registry.npmjs.org)"
          if [[ "$VERIFIED_TAG" != "v$verified_version" || \
                "$npm_latest" != "\"$verified_version\"" ]]; then
            echo "::error::npm latest is $npm_latest, expected $verified_version"
            exit 1
          fi

          printf -v expected_release_body \
            'Automated immutable release for @hraness/kb@%s.\n\nSource commit: %s\nWorkflow run: %s' \
            "$verified_version" "$VERIFIED_SOURCE_SHA" "$GITHUB_RUN_ID"
          final_default_sha="$(verify_current_release_controls)"
          if [[ "$final_default_sha" != "$current_default_sha" ]]; then
            echo "::error::Current $DEFAULT_BRANCH moved during final release authorization"
            exit 1
          fi
          release_json="$(mktemp "$RUNNER_TEMP/kb-release.XXXXXX")"
          if ! gh release create "$VERIFIED_TAG" \
            --verify-tag \
            --latest \
            --title "KB $VERIFIED_TAG" \
            --notes "$expected_release_body"; then
            echo "::notice::Release creation did not complete; validating exact idempotent state"
          fi
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG" \
            > "$release_json"
          RELEASE_JSON="$release_json" \
            EXPECTED_ACTIONS_BOT_ID="41898282" \
            EXPECTED_BODY="$expected_release_body" \
            EXPECTED_NAME="KB $VERIFIED_TAG" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const release = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8"));
          if (
            !release
            || typeof release !== "object"
            || release.tag_name !== process.env.VERIFIED_TAG
            || release.name !== process.env.EXPECTED_NAME
            || release.body !== process.env.EXPECTED_BODY
            || release.draft !== false
            || release.prerelease !== false
            || release.immutable !== true
            || !Array.isArray(release.assets)
            || release.assets.length !== 0
            || release.author?.id !== Number(process.env.EXPECTED_ACTIONS_BOT_ID)
            || release.author?.login !== "github-actions[bot]"
            || release.author?.type !== "Bot"
          ) throw new Error("GitHub Release is not the exact immutable artifact created by this authorized Actions run");
          NODE
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$VERIFIED_TAG" ]]; then
            echo "::error::Latest release is $latest_tag, expected $VERIFIED_TAG"
            exit 1
          fi
