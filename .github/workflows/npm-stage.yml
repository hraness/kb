name: Stage npm package

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Stage the verified package through npm trusted publishing
        required: false
        default: false
        type: boolean
      resolved_stage_version:
        description: Exact prior stage version already rejected in npm; leave empty normally
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  select:
    name: Select stable package version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current_version: ${{ steps.selection.outputs.current_version }}
      reason: ${{ steps.selection.outputs.reason }}
      should_stage: ${{ steps.selection.outputs.should_stage }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Select stage request
        id: selection
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          git check-ref-format "$expected_ref"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Run npm staging from $expected_ref, received $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin \
            "$expected_ref:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$default_head" || "$checked_out_head" != "$default_head" ]]; then
            echo "::error::Npm staging commit $GITHUB_SHA is not current $DEFAULT_BRANCH head $default_head"
            exit 1
          fi

          selection_args=(
            --current-manifest package.json
            --event "$GITHUB_EVENT_NAME"
            --github-output "$GITHUB_OUTPUT"
          )
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              ;;
            push)
              if [[ ! "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ || \
                    "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
                echo "::error::Push event does not identify a previous commit"
                exit 1
              fi
              if ! git cat-file -e "$BEFORE_SHA^{commit}"; then
                echo "::error::Previous push commit $BEFORE_SHA is unavailable"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$BEFORE_SHA" "$default_head"; then
                echo "::error::Previous push commit $BEFORE_SHA is not an ancestor of current $DEFAULT_BRANCH"
                exit 1
              fi
              previous_manifest="$RUNNER_TEMP/kb-previous-package.json"
              git show "$BEFORE_SHA:package.json" > "$previous_manifest"
              selection_args+=(--previous-manifest "$previous_manifest")
              ;;
            *)
              echo "::error::Unsupported npm staging event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          bun run ./scripts/npm-stage-selection.ts "${selection_args[@]}"

  verify:
    name: Verify exact package
    needs: select
    if: needs.select.outputs.should_stage == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      package_version: ${{ steps.artifact.outputs.package_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.artifact.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          [[ "$(node --version)" == v24.* ]]
      - name: Require current default-branch head
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Run this workflow from $expected_ref, received $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$default_head" || "$checked_out_head" != "$default_head" ]]; then
            echo "::error::Workflow commit $GITHUB_SHA is not current $DEFAULT_BRANCH head $default_head"
            exit 1
          fi
          printf 'source_sha=%s\n' "$default_head" >> "$GITHUB_OUTPUT"
      - name: Verify package can be staged
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_name" != "@hraness/kb" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semantic version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$package_version" >/dev/null; then
            echo "::error::Create v$package_version only after exact npm delivery is verified"
            exit 1
          fi
          if ! npm view "$package_name" name --json \
            --registry=https://registry.npmjs.org >/dev/null; then
            echo "::error::$package_name must be bootstrapped interactively before staged publishing can run"
            exit 1
          fi
          version_error="$RUNNER_TEMP/npm-version-error.txt"
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>"$version_error"; then
            echo "::error::$package_name@$package_version is already public"
            exit 1
          fi
          if ! grep -q 'E404' "$version_error"; then
            cat "$version_error"
            echo "::error::Could not prove that $package_name@$package_version is unpublished"
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify generated tree
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Prepare and smoke exact npm artifact
        id: artifact
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/kb-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          package_version="$(node -p 'require("./package.json").version')"
          tarball_name="hraness-kb-$package_version.tgz"
          archive="$artifact_directory/$tarball_name"
          metadata="$artifact_directory/npm-pack.json"
          digest="$artifact_directory/npm-package.sha256"
          bun run ./scripts/prepare-npm-package.ts "$artifact_directory"
          bun run ./scripts/package-smoke.ts \
            --archive "$archive" \
            --pack-json "$metadata"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          metadata_sha256="$(sha256sum "$metadata" | cut -d ' ' -f 1)"
          printf '%s  %s\n%s  npm-pack.json\n' \
            "$archive_sha256" "$tarball_name" "$metadata_sha256" > "$digest"
          (
            cd "$artifact_directory"
            sha256sum --check npm-package.sha256
          )
          artifact_entry_count="$(ARTIFACT_DIRECTORY="$artifact_directory" node -e '
            const { readdirSync } = require("node:fs");
            process.stdout.write(String(readdirSync(process.env.ARTIFACT_DIRECTORY).length));
          ')"
          if [[ "$artifact_entry_count" != 3 ]]; then
            echo "::error::Reviewed npm artifact must contain exactly three files"
            exit 1
          fi
          for required_file in "$archive" "$metadata" "$digest"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Reviewed npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          artifact_name="npm-package-$package_version-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_name=%s\npackage_version=%s\ntarball_name=%s\n' \
            "$artifact_name" "$package_version" "$tarball_name" >> "$GITHUB_OUTPUT"
      - name: Upload reviewed npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/kb-npm-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 30

  stage:
    name: Stage exact package v${{ needs.verify.outputs.package_version }}
    needs: verify
    if: inputs.publish_to_npm == true
    environment: npm-stage
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reauthorize current npm staging attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/kb"
          EXPECTED_REPOSITORY_ID: "1308971873"
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_WORKFLOW_ID: "344070109"
          EXPECTED_WORKFLOW_NAME: "Stage npm package"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/npm-stage.yml"
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TO_NPM: ${{ inputs.publish_to_npm }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                "$PUBLISH_TO_NPM" != true || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != refs/heads/main || \
                "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Current npm staging attempt is not the explicit owner-authorized protected-main dispatch"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/kb-stage-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/kb-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/kb-stage-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$EXPECTED_SOURCE_SHA" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current npm staging attempt is not owner-authorized for this exact public workflow");
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          [[ "$(node --version)" == v24.* ]]
      - name: Reject unresolved stable-stage intent
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          EXPECTED_WORKFLOW_ID: "344070109"
          GH_TOKEN: ${{ github.token }}
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const expectedName = "@hraness/kb";
          const expectedVersion = process.env.EXPECTED_VERSION ?? "";
          const workflowId = process.env.EXPECTED_WORKFLOW_ID ?? "";
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          const currentRunId = process.env.GITHUB_RUN_ID ?? "";
          const resolvedStageVersion = process.env.RESOLVED_STAGE_VERSION ?? "";
          const legacyStageJobs = new Map([
            ["33269920554", Object.freeze({
              headSha: "e12d3fd05ffaa722ac1c43a8ecaa7d21fece679a",
              jobConclusion: "success",
              jobId: 99146963354,
              mutationConclusion: "success",
              runAttempt: 1,
              version: "0.17.3",
            })],
          ]);
          const maximum = BigInt(Number.MAX_SAFE_INTEGER);
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
          const parseVersion = (value, label) => {
            const match = versionPattern.exec(value);
            if (match === null) throw new Error(`${label} is not a stable semantic version`);
            const parts = match.slice(1).map(BigInt);
            if (parts.some((part) => part > maximum)) {
              throw new Error(`${label} exceeds Number.MAX_SAFE_INTEGER`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
            }
            return 0;
          };
          const execute = (command, args, label) => {
            const result = spawnSync(command, args, {
              encoding: "utf8",
              maxBuffer: 10 * 1024 * 1024,
            });
            if (result.status !== 0 || result.error) {
              throw new Error(`Could not read ${label}`);
            }
            return result.stdout;
          };
          const workflowNumber = Number(workflowId);
          const currentRunNumber = Number(currentRunId);
          if (
            !/^[1-9][0-9]*$/u.test(workflowId)
            || !/^[1-9][0-9]*$/u.test(currentRunId)
            || !Number.isSafeInteger(workflowNumber)
            || !Number.isSafeInteger(currentRunNumber)
            || repository !== "hraness/kb"
          ) throw new Error("Stable-stage history identity is invalid");
          const current = parseVersion(expectedVersion, "Candidate version");
          const resolved = resolvedStageVersion === ""
            ? null
            : parseVersion(resolvedStageVersion, "Resolved prior stage version");
          const latestValue = JSON.parse(execute("npm", [
            "view",
            expectedName,
            "dist-tags.latest",
            "--json",
            "--registry=https://registry.npmjs.org",
          ], "npm latest"));
          if (typeof latestValue !== "string") throw new Error("npm latest is not a version string");
          const latest = parseVersion(latestValue, "npm latest");
          if (compare(current, latest) <= 0) {
            throw new Error(`Candidate ${expectedVersion} is not newer than npm latest ${latestValue}`);
          }
          const priorTag = `v${latestValue}`;
          const remoteTagLines = execute("git", [
            "ls-remote",
            "--tags",
            `https://github.com/${repository}.git`,
            `refs/tags/${priorTag}`,
            `refs/tags/${priorTag}^{}`,
          ], `annotated tag ${priorTag}`).trim().split("\n");
          if (remoteTagLines.length !== 2) {
            throw new Error(`npm latest ${latestValue} lacks one annotated Git tag`);
          }
          const tagIdentity = new Map();
          for (const line of remoteTagLines) {
            const match = /^([0-9a-f]{40})\t(refs\/tags\/v[^\s^]+)(\^\{\})?$/u.exec(line);
            if (match === null || match[2] !== `refs/tags/${priorTag}`) {
              throw new Error(`npm latest ${latestValue} has a malformed Git tag identity`);
            }
            const field = match[3] === undefined ? "object" : "source";
            if (tagIdentity.has(field)) throw new Error(`npm latest ${latestValue} repeats its Git tag identity`);
            tagIdentity.set(field, match[1]);
          }
          if (
            tagIdentity.get("object") === tagIdentity.get("source")
            || typeof tagIdentity.get("source") !== "string"
          ) {
            throw new Error(`npm latest ${latestValue} is not bound by an annotated Git tag`);
          }
          const release = JSON.parse(execute("gh", [
            "api",
            `repos/${repository}/releases/tags/${priorTag}`,
          ], `immutable release ${priorTag}`));
          const latestRelease = JSON.parse(execute("gh", [
            "api",
            `repos/${repository}/releases/latest`,
          ], "latest immutable release"));
          if (
            release?.tag_name !== priorTag
            || release?.name !== `KB ${priorTag}`
            || release?.draft !== false
            || release?.prerelease !== false
            || release?.immutable !== true
            || release?.author?.id !== 41898282
            || release?.author?.login !== "github-actions[bot]"
            || release?.author?.type !== "Bot"
            || !Array.isArray(release?.assets)
            || release.assets.length !== 0
            || latestRelease?.id !== release.id
            || latestRelease?.tag_name !== priorTag
            || latestRelease?.immutable !== true
          ) {
            throw new Error(`npm latest ${latestValue} lacks its exact immutable GitHub Release`);
          }
          const comparison = JSON.parse(execute("gh", [
            "api",
            `repos/${repository}/compare/${tagIdentity.get("source")}...main`,
          ], `main ancestry for ${priorTag}`));
          if (comparison?.status !== "ahead" && comparison?.status !== "identical") {
            throw new Error(`npm latest ${latestValue} is not reachable from current main`);
          }
          const intentRuns = new Map();
          const resolutionCounts = new Map();
          const increment = (map, version) => map.set(version, (map.get(version) ?? 0) + 1);
          const reserve = (version, runId) => {
            parseVersion(version, `Reserved version from run ${runId}`);
            const runs = intentRuns.get(version) ?? [];
            runs.push(runId);
            intentRuns.set(version, runs);
          };
          const inspectRunJobs = (runId) => {
            const jobsPayload = JSON.parse(execute("gh", [
              "api",
              "--method", "GET",
              `/repos/${repository}/actions/runs/${runId}/jobs?filter=all&per_page=100`,
            ], `jobs for npm-stage run ${runId}`));
            if (
              !jobsPayload
              || typeof jobsPayload !== "object"
              || !Number.isSafeInteger(jobsPayload.total_count)
              || jobsPayload.total_count < 0
              || jobsPayload.total_count > 100
              || !Array.isArray(jobsPayload.jobs)
              || jobsPayload.jobs.length !== jobsPayload.total_count
            ) throw new Error(`npm-stage run ${runId} exceeds the reviewed 100-job bound`);
            for (const job of jobsPayload.jobs) {
              if (
                !job
                || typeof job !== "object"
                || typeof job.name !== "string"
                || !Array.isArray(job.steps)
                || job.steps.length > 100
              ) {
                throw new Error(`npm-stage run ${runId} contains an invalid job`);
              }
              const terminalWrites = job.steps.filter((step) => (
                step?.name === "Revalidate current main and stage exact package"
                && step?.conclusion !== null
                && step?.conclusion !== "skipped"
              ));
              const intents = job.steps.filter((step) => (
                step?.name === "Record exclusive stable-stage intent"
                && step?.conclusion === "success"
              ));
              const resolutions = job.steps.filter((step) => (
                typeof step?.name === "string"
                && step.name.startsWith("Record cleared stable-stage intent")
                && step?.conclusion === "success"
              ));
              const hasSafePositiveStepNumber = (step) => (
                Number.isSafeInteger(step?.number) && step.number > 0
              );
              if (intents.length > 1 || resolutions.length > 1) {
                throw new Error(`npm-stage run ${runId} has ambiguous intent history`);
              }
              if (job.name === "Stage exact package") {
                const legacy = legacyStageJobs.get(String(runId));
                const legacyMutations = job.steps.filter((step) => (
                  step?.name === "Revalidate current main and stage exact package"
                ));
                if (
                  legacy === undefined
                  || job.id !== legacy.jobId
                  || job.head_sha !== legacy.headSha
                  || job.run_attempt !== legacy.runAttempt
                  || job.status !== "completed"
                  || job.conclusion !== legacy.jobConclusion
                  || legacyMutations.length !== 1
                  || legacyMutations[0]?.conclusion !== legacy.mutationConclusion
                  || intents.length !== 0
                  || resolutions.length !== 0
                ) {
                  throw new Error(`npm-stage run ${runId} has an unsealed generic stage job`);
                }
                reserve(legacy.version, runId);
                continue;
              }
              if (
                terminalWrites.length > 1
                || (terminalWrites.length === 1 && (
                  intents.length !== 1
                  || !hasSafePositiveStepNumber(terminalWrites[0])
                  || !hasSafePositiveStepNumber(intents[0])
                  || intents[0].number !== terminalWrites[0].number - 1
                ))
              ) {
                throw new Error(
                  `npm-stage run ${runId} has a terminal write without one immediately preceding durable intent`,
                );
              }
              if (!job.name.startsWith("Stage exact package")) {
